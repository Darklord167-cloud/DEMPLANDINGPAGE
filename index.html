<!DOCTYPE html>

<head>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Workaround: Prevent whatwg-fetch and other polyfills from crashing the app when trying to overwrite window.fetch
        if (typeof window !== 'undefined' && window.fetch) {
            const originalFetch = window.fetch;
            try {
                Object.defineProperty(window, 'fetch', {
                    get: function() { return originalFetch; },
                    set: function() { console.warn('Intercepted third-party attempt to overwrite window.fetch'); },
                    configurable: true,
                    enumerable: true
                });
            } catch(e) {
                console.error('Could not protect window.fetch:', e);
            }
        }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: {
                            black: '#050505',
                            dark: '#0a0a0a',
                            gray: '#1a1a1a',
                            red: '#dc2626',
                            crimson: '#991b1b',
                            gold: '#fbbf24'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(220, 38, 38, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(220, 38, 38, 0.6), 0 0 10px rgba(220, 38, 38, 0.4)' },
                        }
                    }
                }
            }
        }
    </script>

            text-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }

        }
    </style>

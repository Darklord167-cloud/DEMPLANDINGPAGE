<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="demp-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18072b" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>
    <radialGradient id="demp-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="demp-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Gradients for Cyber Crest -->
    <linearGradient id="demp-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="demp-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="demp-accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#demp-bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#demp-glow-purple)"/>
  <circle cx="256" cy="256" r="160" fill="url(#demp-glow-cyan)"/>
  
  <!-- Outer Tech Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#a855f7" stroke-width="6" stroke-dasharray="24 12" opacity="0.75" filter="url(#neon-glow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#6b21a8" stroke-width="2" opacity="0.4"/>
  
  <!-- Outer Shield Geometry -->
  <path d="M256,64 L390,120 L390,260 C390,350 256,440 256,440 C256,440 122,350 122,260 L122,120 Z" 
        fill="#0b0716" stroke="url(#demp-purple-grad)" stroke-width="8" filter="url(#neon-glow)"/>
  
  <!-- Inner Cyber Wings / Crest -->
  <path d="M256,104 L352,148 L352,252 C352,320 256,392 256,392 C256,392 160,320 160,252 L160,148 Z" 
        fill="#130924" stroke="url(#demp-cyan-grad)" stroke-width="4" opacity="0.9"/>
        
  <!-- Central Imperial Crown / Horns Overlay -->
  <g transform="translate(6, 4)">
    <!-- Crown Points -->
    <path d="M190,170 L220,210 L250,150 L280,210 L310,170 L295,240 L205,240 Z" fill="url(#demp-accent-grad)" opacity="0.9"/>
    
    <!-- Diamond Core Crest -->
    <path d="M250,190 L310,270 L250,350 L190,270 Z" fill="url(#demp-purple-grad)" stroke="#00f0ff" stroke-width="4" filter="url(#neon-glow)"/>
    <circle cx="250" cy="270" r="32" fill="#07030e" stroke="#00f0ff" stroke-width="5"/>
    <circle cx="250" cy="270" r="14" fill="url(#demp-cyan-grad)"/>
    <circle cx="250" cy="270" r="5" fill="#ffffff"/>
  </g>

  <!-- Glowing Corner Cyber Nodes -->
  <circle cx="122" cy="120" r="6" fill="#00f0ff"/>
  <circle cx="390" cy="120" r="6" fill="#00f0ff"/>
  <circle cx="256" cy="64" r="7" fill="#c084fc"/>
</svg>

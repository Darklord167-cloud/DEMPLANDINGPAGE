<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="demp-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#230940" />
      <stop offset="60%" stop-color="#0f041d" />
      <stop offset="100%" stop-color="#030108" />
    </radialGradient>
    <radialGradient id="demp-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="demp-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Gradients for Cyber Crest -->
    <linearGradient id="demp-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="30%" stop-color="#e879f9" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="demp-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="demp-accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- High Intensity Glow Filters -->
    <filter id="neon-glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crisp Drop Shadow Filter -->
    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#demp-bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#demp-glow-purple)"/>
  <circle cx="256" cy="256" r="160" fill="url(#demp-glow-cyan)"/>
  
  <!-- Outer Tech Rings -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#e879f9" stroke-width="5" stroke-dasharray="28 14" opacity="0.85" filter="url(#neon-glow-purple)"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="10 18" opacity="0.75" filter="url(#neon-glow-cyan)"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#6b21a8" stroke-width="2.5" opacity="0.5"/>
  
  <!-- Outer Shield Shadow & Geometry -->
  <path d="M256,60 L394,116 L394,264 C394,356 256,448 256,448 C256,448 118,356 118,264 L118,116 Z" 
        fill="#0b0618" stroke="url(#demp-purple-grad)" stroke-width="9" filter="url(#shield-shadow)"/>
  <path d="M256,60 L394,116 L394,264 C394,356 256,448 256,448 C256,448 118,356 118,264 L118,116 Z" 
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Inner Cyber Wings / Crest -->
  <path d="M256,100 L356,144 L356,254 C356,324 256,398 256,398 C256,398 156,324 156,254 L156,144 Z" 
        fill="#120827" stroke="url(#demp-cyan-grad)" stroke-width="5" opacity="0.95" filter="url(#neon-glow-cyan)"/>
        
  <!-- Central Imperial Crown / Horns Overlay -->
  <g transform="translate(6, 4)">
    <!-- Crown Points -->
    <path d="M188,166 L220,208 L250,144 L280,208 L312,166 L296,238 L204,238 Z" fill="url(#demp-accent-grad)" opacity="0.95" filter="url(#neon-glow-purple)"/>
    
    <!-- Diamond Core Crest -->
    <path d="M250,186 L312,268 L250,350 L188,268 Z" fill="url(#demp-purple-grad)" stroke="#00f0ff" stroke-width="5" filter="url(#neon-glow-purple)"/>
    <circle cx="250" cy="268" r="34" fill="#07030e" stroke="#00f0ff" stroke-width="5" filter="url(#neon-glow-cyan)"/>
    <circle cx="250" cy="268" r="16" fill="url(#demp-cyan-grad)"/>
    <circle cx="250" cy="268" r="6" fill="#ffffff" filter="url(#neon-glow-cyan)"/>
  </g>

  <!-- Glowing Corner Cyber Nodes -->
  <circle cx="118" cy="116" r="7" fill="#00f0ff" filter="url(#neon-glow-cyan)"/>
  <circle cx="394" cy="116" r="7" fill="#00f0ff" filter="url(#neon-glow-cyan)"/>
  <circle cx="256" cy="60" r="8" fill="#e879f9" filter="url(#neon-glow-purple)"/>
</svg>

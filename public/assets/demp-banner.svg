<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b0933" />
      <stop offset="60%" stop-color="#0a0316" />
      <stop offset="100%" stop-color="#030108" />
    </radialGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="banner-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="banner-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="banner-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>
  
  <!-- Cyber Grid overlay -->
  <g stroke="#a855f7" stroke-opacity="0.08" stroke-width="1">
    <path d="M0,105 L1200,105 M0,210 L1200,210 M0,315 L1200,315 M0,420 L1200,420 M0,525 L1200,525" />
    <path d="M200,0 L200,630 M400,0 L400,630 M600,0 L600,630 M800,0 L800,630 M1000,0 L1000,630" />
  </g>
  
  <!-- Cyber Shield Logo on the left -->
  <g transform="translate(110, 155) scale(0.625)">
    <!-- Outer Shield Geometry -->
    <path d="M256,60 L394,116 L394,264 C394,356 256,448 256,448 C256,448 118,356 118,264 L118,116 Z" 
          fill="#0b0618" stroke="url(#banner-purple-grad)" stroke-width="10" filter="url(#banner-neon-glow)"/>
    <!-- Inner Wings -->
    <path d="M256,100 L356,144 L356,254 C356,324 256,398 256,398 C256,398 156,324 156,254 L156,144 Z" 
          fill="#120827" stroke="url(#banner-cyan-grad)" stroke-width="5" opacity="0.95"/>
    <!-- Crown & Diamond Core -->
    <g transform="translate(6, 4)">
      <path d="M188,166 L220,208 L250,144 L280,208 L312,166 L296,238 L204,238 Z" fill="url(#primaryTextGrad)" opacity="0.9"/>
      <path d="M250,186 L312,268 L250,350 L188,268 Z" fill="url(#banner-purple-grad)" stroke="#00f0ff" stroke-width="5" filter="url(#banner-neon-glow)"/>
      <circle cx="250" cy="268" r="34" fill="#07030e" stroke="#00f0ff" stroke-width="5"/>
      <circle cx="250" cy="268" r="16" fill="url(#banner-cyan-grad)"/>
      <circle cx="250" cy="268" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- Text -->
  <text x="500" y="220" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#00f0ff" letter-spacing="10">COMMAND THE DIGITAL FRONTIER</text>
  <text x="500" y="320" font-family="Arial, sans-serif" font-weight="900" font-size="110" fill="url(#textGrad)" letter-spacing="4">DARK</text>
  <text x="500" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="110" fill="url(#primaryTextGrad)" letter-spacing="6">EMPIRE</text>
  
  <rect x="500" y="460" width="600" height="2" fill="#a855f7" opacity="0.3"/>
  <rect x="500" y="460" width="200" height="2" fill="#00f0ff"/>
  
  <text x="500" y="520" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" letter-spacing="6">OFFICIAL $DEMP TOKEN</text>
  <text x="500" y="560" font-family="Courier New, monospace" font-weight="bold" font-size="18" fill="#c084fc" letter-spacing="4">AI // TRADING // AUTOMATION</text>

  <!-- Borders/Accents -->
  <path d="M 40 40 L 120 40 L 130 50" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 1160 590 L 1080 590 L 1070 580" fill="none" stroke="#a855f7" stroke-width="3" />
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2" />
</svg>
